; Throwaway touch-controller diagnostic for the T-Watch 2020 (NOT the release firmware).
; Raw Wire only (no TTGO library). Same partition table / flash layout as the real
; firmware, so a plain upload keeps the MP3 slots (LittleFS) and NVS intact.
;   cd tools/touchdiag && pio run -t upload
; then capture: python ../watch_serial.py listen --reset --secs 40
[env:touchdiag]
platform = espressif32@~6.9.0
board = esp32dev
framework = arduino
board_build.partitions = ../../partitions.csv
board_upload.flash_size = 16MB
board_build.flash_mode = dio
upload_port = COM8
monitor_port = COM8
monitor_speed = 115200
