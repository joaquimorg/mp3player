[env:watch]
platform = espressif32@~6.9.0
board = esp32dev
framework = arduino
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
board_upload.flash_size = 16MB
board_build.flash_mode = dio
; Fixes a stray black pixel column in TFT_eSprite::fillRect (see the script).
extra_scripts = pre:tools/patch_tft_espi.py
upload_port = COM8
monitor_port = COM8
monitor_speed = 115200
build_flags =
    -DLILYGO_WATCH_2020_V1
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -mfix-esp32-psram-cache-strategy=memw
lib_deps =
    https://github.com/Xinyuan-LilyGO/TTGO_TWatch_Library.git#V1.4.3
    https://github.com/pschatzmann/ESP32-A2DP.git#v1.8.5
    https://github.com/pschatzmann/arduino-libhelix.git#v0.9.4

; NOTE: cannot run on this PC (no host g++ installed). Lists only the folders whose code
; is free of Arduino/ESP32 dependencies, so it is not misleading where a compiler exists.
[env:native]
platform = native
test_framework = unity
test_filter =
    test_native
    test_net
    test_serproto
    test_ui
build_src_filter = -<*>
lib_deps =

; On-device unit tests: runs Unity tests on the watch itself (COM8).
; Usage: pio test -e watch_test            (skips test_device, which is destructive)
;        pio test -e watch_test -f test_net
; WARNING: test_device wipes all 4 slots and the NVS 'mp3' namespace (Wi-Fi credentials,
; volume, paired speaker). Run it only with: pio test -e watch_test_destructive
[env:watch_test]
extends = env:watch
test_framework = unity
test_port = COM8
test_speed = 115200
test_build_src = yes
test_ignore = test_device

; Opt-in: runs ONLY the destructive device tests (erases slots + Wi-Fi credentials!).
[env:watch_test_destructive]
extends = env:watch_test
test_ignore =
test_filter = test_device

; UI debug build: the real firmware plus a serial console (115200) that injects
; touches and prints the screen state, to drive the UI from a PC:
;   tap <x> <y> | screen | heap | scan (I2C) | reboot (software reset) | stall (next switch hangs) | soak (fake audio consumer + [stat] every 10 s)
; Usage: pio run -e watch_uidebug -t upload. Not for normal use.
[env:watch_uidebug]
extends = env:watch
build_flags =
    ${env:watch.build_flags}
    -DUI_DEBUG

; Network diagnostics: watch_uidebug (serial console) plus core logs (level 3) and a [diag] line
; every 2 s (netmode loop count, time inside handleClient, upload bytes, RSSI, heap).
[env:watch_netdiag]
extends = env:watch
build_flags =
    ${env:watch.build_flags}
    -DCORE_DEBUG_LEVEL=3
    -DNET_DIAG
    -DUI_DEBUG
