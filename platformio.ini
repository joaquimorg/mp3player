[env:watch]
platform = espressif32@~6.9.0
board = esp32dev
framework = arduino
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
board_upload.flash_size = 16MB
board_build.flash_mode = dio
upload_port = COM8
monitor_port = COM8
monitor_speed = 115200
build_flags =
    -DLILYGO_WATCH_2020_V1
    -DBOARD_HAS_PSRAM
lib_deps =
    https://github.com/Xinyuan-LilyGO/TTGO_TWatch_Library.git#V1.4.3
    https://github.com/pschatzmann/ESP32-A2DP.git#v1.8.5
    https://github.com/pschatzmann/arduino-audio-tools.git#v1.3.0
    https://github.com/pschatzmann/arduino-libhelix.git#v0.9.4

[env:native]
platform = native
test_framework = unity
build_src_filter = -<*>
lib_deps =

; On-device unit tests: runs Unity tests on the watch itself (COM8).
; Usage: pio test -e watch_test
[env:watch_test]
extends = env:watch
test_framework = unity
test_port = COM8
test_speed = 115200
